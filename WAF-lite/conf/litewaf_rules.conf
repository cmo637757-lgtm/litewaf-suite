# =============================================================================
# LiteWAF-NGX 默认规则集（rules-v3，S8 补强 SQLi 检出 + XSS 载体覆盖）
# -----------------------------------------------------------------------------
# v1 → v2 的变化（有据可查：R34-11 的 80 条带标签样本评估）
#   v1 在冻结样本集上 SQLi 只检出 7/20，漏的全是「逻辑恒真 / 时间盲注 / 报错注入 /
#   元数据探测 / 排序探测 / 文件读写」这几类，1000 的关键字规则分值不够、1001 又只认
#   or 1=1 一种写法。v2 按 1007-1013 补了 7 条 8 分规则，检出到 20/20，正常样本误拦仍为 0。
#   改动走的是平台 check → publish 流程，rules-v1 仍可从「回退」恢复。
# v2 → v3 的变化（200 条对抗样本评估，2026-10-22 下午）
#   ① 1005 从 `.{0,80}` 放宽到 `[^a-zA-Z]{0,40}`，UNION%0aSELECT 换行分隔不再漏；
#   ② 新增 1014 拦「块注释夹在 SQL 关键字两侧」的写法（AND/**/1=1、union/**/select）；
#   ③ 新增 1304-1307 补 XSS 的非 script 载体、data:text/html、CSS 注入、DOM 汇点。
#   同样走 check → publish 流程发布，v2 仍可回退。
# -----------------------------------------------------------------------------
# 语法（由 src/lwaf_rule_engine.c 解析，PCRE2 正则）：
#   lwaf_rule id=<正整数> name="<显示名>" type=str|rx pattern="<匹配串>"
#             zones=URL,ARGS,BODY,HEADERS,COOKIE,USER_AGENT,FILE_EXT
#             score=<类别>:<分值> action=score|block|log
#
# 打分机制：每条命中给对应类别加分；某类别累计分 >= lite_waf_score_threshold
# 里该类阈值（或 TOTAL 阈值）即拦截。action=block 的规则一命中立刻拦（不等累计）。
#
# ID 段（与产品设计一致，新增规则别串段）：
#   1000-1099 SQLi        1100-1199 RFI（远程文件包含）
#   1200-1299 目录遍历    1300-1399 XSS
#   1400-1499 编码绕过    1500-1599 文件上传
#   2000-2099 扫描器/机器人
#
# CC 攻击不在这份文件里：由共享内存泄漏桶（lite_waf_dynamic_block /
# lite_waf_max_requests / lite_waf_cc_window / lite_waf_block_duration）处理，
# 日志表现是 reason=dynamic_block、category 为空，展示层映射为 CC。
#
# 冻结口径：本文件 hash 记入 docs/基线说明.md 的 rules-v1，改动必须走
# check → publish → 回退 的版本流程，不能直接改线上文件。
# =============================================================================

# ---- SQL 注入（1000-1099）----
# 1000 通用 SQL 关键字，4 分：单词边界匹配，避免误伤 "selected" 这类普通词。
#      v3 把 drop/table 移出本规则：这两个词在正常短语里太常见（drop table of contents、
#      table for two），由 1006 单独以「drop+table 且后面不是 of」的精确形态判定。
lwaf_rule id=1000 name="sql keywords" type=rx pattern="\\b(select|union|update|delete|insert|from|where)\\b" zones=URL,ARGS,BODY,COOKIE score=SQL:4 action=score
# 1001 恒真式 OR 1=1，8 分：手工注入最典型的探测语句
lwaf_rule id=1001 name="sql boolean tautology" type=rx pattern="\\bor\\b\\s+['\"]?1['\"]?\\s*=\\s*['\"]?1" zones=ARGS,BODY,COOKIE score=SQL:8 action=score
# 1002 单行注释 --，4 分：常用于截断后半句 SQL
lwaf_rule id=1002 name="sql comment marker" type=str pattern="--" zones=URL,ARGS,BODY,COOKIE score=SQL:4 action=score
# 1003 块注释 /*，4 分：用于包裹/截断语句
lwaf_rule id=1003 name="sql block comment" type=str pattern="/*" zones=URL,ARGS,BODY,COOKIE score=SQL:4 action=score
# 1004 十六进制字面量 0x..，4 分：绕过引号的常见写法
lwaf_rule id=1004 name="hex literal" type=rx pattern="\\b0x[0-9a-f]{2,}\\b" zones=ARGS,BODY,COOKIE score=SQL:4 action=score
# 1005 union ... select 组合，8 分：联合查询注入的强信号。v3 把空白放宽到
#      「任意非字母字符 40 个以内」，这样 UNION%0aSELECT（换行）、un/**/ion 拆词
#      之外的分隔符都能覆盖；纯字母间隔（un'ion 这类）仍然不匹配，避免误伤 union 单词。
lwaf_rule id=1005 name="sql union select chain" type=rx pattern="(?i)\\bunion\\b[^a-zA-Z]{0,40}\\bselect\\b" zones=URL,ARGS,BODY,COOKIE score=SQL:8 action=score
# 1006 drop/delete + table/from，8 分：破坏性语句。v3 加否定前瞻排除
#      "drop table of contents" 这类书名/菜名式的正常短语（误报样本实测出来的）。
lwaf_rule id=1006 name="sql destructive statement" type=rx pattern="(?i)\\b(drop|delete)\\s+(table|database)\\b(?!\\s+of\\b)|\\bdelete\\s+from\\b" zones=ARGS,BODY,COOKIE score=SQL:8 action=score
# 1007 逻辑恒真带数字，8 分：AND 1=1 / OR 1=2 这类手工探测（1001 只认 or 1=1 一种写法）
lwaf_rule id=1007 name="sql tautology numeric" type=rx pattern="(?i)\\b(and|or)\\s+['\"]?\\d+['\"]?\\s*=\\s*['\"]?\\d+" zones=ARGS,BODY,COOKIE score=SQL:8 action=score
# 1008 逻辑恒真带标识符，8 分：'x'='x、1 or 'a'='a' 这类字符串恒等式
lwaf_rule id=1008 name="sql tautology string" type=rx pattern="(?i)\\b(and|or)\\s+['\"]?[a-z_][a-z0-9_]*['\"]?\\s*=\\s*['\"]?[a-z_][a-z0-9_]*['\"]?" zones=ARGS,BODY,COOKIE score=SQL:8 action=score
# 1009 时间盲注，8 分：SLEEP() / BENCHMARK() / WAITFOR DELAY，正常业务不会在参数里出现
lwaf_rule id=1009 name="sql time based blind" type=rx pattern="(?i)\\b(sleep|benchmark|pg_sleep)\\s*\\(|waitfor\\s+delay" zones=ARGS,BODY,COOKIE score=SQL:8 action=score
# 1010 报错注入，8 分：EXTRACTVALUE / UPDATEXML 拿报错回显数据
lwaf_rule id=1010 name="sql error based injection" type=rx pattern="(?i)\\b(extractvalue|updatexml)\\s*\\(" zones=ARGS,BODY,COOKIE score=SQL:8 action=score
# 1011 元数据库探测，8 分：摸表结构的强信号。v3 补 sys.tables/mysql.user 与 @@version
#      （SQL Server/MySQL 的版本与系统表探测，正常业务参数不会出现）。
lwaf_rule id=1011 name="sql metadata probe" type=rx pattern="(?i)\\b(information_schema|pg_catalog|sysobjects|sys\\.tables|mysql\\.user)\\b|@@version" zones=ARGS,BODY,COOKIE score=SQL:8 action=score
# 1012 排序/分组探测，8 分：ORDER BY 100 / GROUP BY 1 是猜列数的常规手法。v3 去掉了
#     单独的 having —— 它把 "?q=having fun" 这类正常请求也拦了（误报样本实锤）。
lwaf_rule id=1012 name="sql order group probe" type=rx pattern="(?i)\\border\\s+by\\s+\\d+|group\\s+by\\s+\\d+" zones=ARGS,BODY,COOKIE score=SQL:8 action=score
# 1013 文件读写，8 分：INTO OUTFILE / LOAD_FILE 写马与读文件
lwaf_rule id=1013 name="sql file read write" type=rx pattern="(?i)\\binto\\s+(out|dump)file\\b|load_file\\s*\\(" zones=ARGS,BODY,COOKIE score=SQL:8 action=score
# 1014 注释夹关键字，8 分（v3 新增）：AND/**/1=1、union/**/select 这类用块注释代替空白的
#      写法，1000/1005/1007 的 \s+ 和 .{0,N} 都匹配不到（注释符切断了词边界）。
lwaf_rule id=1014 name="sql comment bypass" type=rx pattern="(?i)(/\\*.*?\\*/\\s*(select|union|and|or|from|where|order|group|having))|((select|union|and|or|from|where|order|group|having)\\s*/\\*.*?\\*/)" zones=ARGS,BODY,COOKIE score=SQL:8 action=score
# 1015 十六进制恒真比较，8 分（v3 新增）：OR 0x31=0x31 / 0x1=0x1，用十六进制绕开数字匹配
lwaf_rule id=1015 name="sql hex tautology" type=rx pattern="(?i)\\b0x[0-9a-f]+\\s*=\\s*0x[0-9a-f]+" zones=ARGS,BODY,COOKIE score=SQL:8 action=score
# 1016 布尔/LIKE 恒真，8 分（v3 新增）：OR TRUE / AND 1 LIKE 1，不写 = 的比较式注入
lwaf_rule id=1016 name="sql true like tautology" type=rx pattern="(?i)\\b(and|or)\\s+true\\b|\\b\\d+\\s+like\\s+\\d+" zones=ARGS,BODY,COOKIE score=SQL:8 action=score
# 1017 关键字拆词，6 分（v3 新增）：un/**/ion sel/**/ect 这种把一个关键字拆成两半的写法，
#      任何按整词匹配的规则都抓不到。6 分是故意的——单靠它不够，配合 1003/* 的块注释分就过阈值。
lwaf_rule id=1017 name="sql keyword split" type=rx pattern="(?i)\\b(un|sel|ord|gro|hav|whe|fro|dro|ins|upd|del)[^a-z0-9]{1,8}(ion|ect|der|oup|ving|ere|om|op|ate|ert|ete)\\b" zones=ARGS,BODY,COOKIE score=SQL:6 action=score
# 1018 MySQL 版本注释，8 分（v3 新增）：/*!50000AND*/ 1=1 —— 注释里的版本号是 MySQL 特有语法，
#      解析器会把里面的内容当 SQL 执行，是绕开关键字黑名单的经典手法。
lwaf_rule id=1018 name="sql mysql version comment" type=rx pattern="(?i)/\\*!\\d+\\s*(and|or|select|union|insert|update|delete|drop)\\b" zones=ARGS,BODY,COOKIE score=SQL:8 action=score
# 1019 and/or 比较式，8 分（v3 新增）：AND 1>0 / OR 2<1 这类不写等号的恒真判断。
#      限定在 and/or 之后，正常参数里不会出现（"and 1>0" 不是人话）。
lwaf_rule id=1019 name="sql comparison tautology" type=rx pattern="(?i)\\b(and|or)\\s+['\"]?\\d+['\"]?\\s*[<>]\\s*['\"]?\\d+" zones=ARGS,BODY,COOKIE score=SQL:8 action=score

# ---- RFI 远程文件包含（1100-1199）----
# 1100 参数里出现 http(s)://，8 分：远程包含的典型载荷
lwaf_rule id=1100 name="rfi http scheme" type=rx pattern="\\bhttps?://" zones=ARGS,BODY,COOKIE score=RFI:8 action=score
# 1101 ftp/php/file/data 伪协议，8 分：本地文件读取与代码执行入口
lwaf_rule id=1101 name="rfi stream wrapper" type=rx pattern="\\b(ftp|php|file|data)://" zones=ARGS,BODY,COOKIE score=RFI:8 action=score

# ---- 目录遍历（1200-1299）----
# 1200 ".."，4 分：路径穿越的基本特征
lwaf_rule id=1200 name="double dot traversal" type=str pattern=".." zones=URL,ARGS,BODY,COOKIE score=TRAVERSAL:4 action=score
# 1201 /etc/passwd，8 分：最经典的穿越目标文件
lwaf_rule id=1201 name="unix passwd path" type=str pattern="/etc/passwd" zones=URL,ARGS,BODY,COOKIE score=TRAVERSAL:8 action=score
# 1202 cmd.exe / powershell.exe，8 分：Windows 命令执行特征
lwaf_rule id=1202 name="windows command shell" type=rx pattern="(cmd\\.exe|powershell\\.exe)" zones=URL,ARGS,BODY,COOKIE score=TRAVERSAL:8 action=score

# ---- XSS（1300-1399）----
# 1300 <script 标签，8 分：XSS 最强信号（容忍空格与斜杠变体）
lwaf_rule id=1300 name="script tag" type=rx pattern="<\\s*/?\\s*script\\b" zones=URL,ARGS,BODY,COOKIE score=XSS:8 action=score
# 1301 javascript: 伪协议，8 分：href/src 注入
lwaf_rule id=1301 name="javascript scheme" type=str pattern="javascript:" zones=URL,ARGS,BODY,COOKIE score=XSS:8 action=score
# 1302 onerror=/onload= 等事件属性，8 分：v2 把词表补全到常见事件（v1 只有 4 个，
#      漏了 onfocus/ontoggle 这类不用点击就能触发的）
lwaf_rule id=1302 name="event handler attribute" type=rx pattern="(?i)\\bon(error|load|focus|blur|click|dblclick|mouseover|mousemove|mouseenter|keydown|keyup|keypress|change|submit|reset|toggle|input|select|scroll|wheel|drag|drop|copy|paste|contextmenu|animationend|transitionend|start|pointerover|animationstart|begin)\\s*=" zones=ARGS,BODY,COOKIE score=XSS:8 action=score
# 1303 成对尖括号 <...>，4 分：宽口径兜底，会与正常富文本冲突，靠阈值兜住误报
lwaf_rule id=1303 name="html angle bracket pair" type=rx pattern="<[^>]+>" zones=URL,ARGS,BODY,COOKIE score=XSS:4 action=score
# 1304 SVG/MathML/iframe 等非 script 载体，8 分（v3 新增）：<svg onload=>、<math href=>、
#      <iframe srcdoc=> 都是绕开 <script 关键字检测的常见载体；正文富文本不在 ARGS 里，误报风险低。
lwaf_rule id=1304 name="xss non script carrier" type=rx pattern="(?i)<\\s*(svg|math|iframe|object|embed|template|noscript|base|formaction)\\b" zones=ARGS,BODY,COOKIE score=XSS:8 action=score
# 1305 data:text/html 伪协议，8 分（v3 新增）：无尖括号也能执行 HTML/JS 的载体
lwaf_rule id=1305 name="xss data html uri" type=rx pattern="(?i)\\bdata\\s*:\\s*text/html" zones=ARGS,BODY,COOKIE score=XSS:8 action=score
# 1306 CSS 注入载体，6 分（v3 新增）：expression() / @import url() / url(javascript:)
lwaf_rule id=1306 name="xss css injection" type=rx pattern="(?i)(expression\\s*\\(|@import\\s+url\\s*\\(|url\\s*\\(\\s*['\"]?\\s*javascript:)" zones=ARGS,BODY,COOKIE score=XSS:6 action=score
# 1307 DOM 危险汇点，8 分（v3 新增）：document.cookie / innerHTML= / eval( 出现在参数里
#      基本只有两类可能——被拼接的脚本片段，或攻击者探测。服务端渲染的正常页面不会传这些。
#      v3 修：从 6 分提到 8 分。6 分单条够不到阈值 8，等于写了不生效（评估实测 document.cookie 被放行）。
lwaf_rule id=1307 name="xss dom sink" type=rx pattern="(?i)\\b(document\\.(cookie|location|write)|innerHTML\\s*=|document\\.write\\s*\\()|\\beval\\s*\\(" zones=ARGS,BODY,COOKIE score=XSS:8 action=score

# ---- 编码绕过（1400-1499）----
# 1400 HTML 实体编码 &#，4 分：实体编码绕过关键字过滤
lwaf_rule id=1400 name="html entity evasion" type=str pattern="&#" zones=URL,ARGS,BODY,COOKIE score=EVADE:4 action=score
# 1401 %XX 百分号编码，4 分：URL 编码绕过
lwaf_rule id=1401 name="percent encoded marker" type=rx pattern="%[23][0-9a-f]" zones=URL,ARGS,BODY,COOKIE score=EVADE:4 action=score
# 1402 %u 旧式 Unicode 编码，4 分：IIS 时代的绕过手法
lwaf_rule id=1402 name="legacy unicode encoding" type=str pattern="%u" zones=ARGS,BODY,COOKIE score=EVADE:4 action=score

# ---- 文件上传（1500-1599）----
# 1500 危险 Web 脚本后缀，8 分：只按后缀判断，不做 multipart 结构解析（能力边界如实标注）
lwaf_rule id=1500 name="dangerous web extension" type=rx pattern="\\.(php[0-9]?|phtml|asp|aspx|jsp|jspx|htaccess)$" zones=FILE_EXT,ARGS,BODY,COOKIE score=UPLOAD:8 action=score

# ---- 扫描器 / 机器人（2000-2099）----
# 2001 扫描器 UA，action=block：一命中直接 403，不等累计分
lwaf_rule id=2001 name="scanner user agent" type=rx pattern="(sqlmap|nikto|acunetix|nessus|python-requests|curl|wget)" zones=USER_AGENT score=SCAN:8 action=block
