worker_processes  1;
error_log  /private/tmp/litewaf-nginx-volume/logs/error.log notice;
pid        /private/tmp/litewaf-nginx-volume/logs/nginx.pid;

events {
    worker_connections  4096;
}

http {
    access_log /private/tmp/litewaf-nginx-volume/logs/access.log;

    server {
        listen 18011;

        location / {
            lite_waf on;
            lite_waf_trust_proxy off;
            lite_waf_deny_status 403;
            lite_waf_rule_file /Users/logib/Documents/Codex/WAF_lite/conf/litewaf_rules.conf;
            lite_waf_score_threshold SQL 8;
            lite_waf_score_threshold XSS 8;
            lite_waf_score_threshold TOTAL 12;
            lite_waf_dynamic_block off;
            lite_waf_log_path /private/tmp/litewaf-nginx-volume/logs/waf_audit.log;

            root /private/tmp/litewaf-nginx-volume/html;
            index index.html;
            try_files $uri /index.html;
        }
    }
}
