# config.ini —— 采集器配置（MariaDB 本机 + 两个日志来源）
#
# 路径必须写绝对路径：采集器只认完整路径，避免相对路径在不同工作目录下指向不同文件。

[db]
host = 127.0.0.1
port = 3306
user = litewaf
password = LiteWaf@2026
database = litewaf

[collector]
poll_interval = 1.0
batch_max = 500
# 心跳文件放 /opt/litewaf/state（可写的独立目录）。
# 不放 logs/ 是因为 logrotate 要求父目录 root:root 755（world/组可写会被拒），
# 而采集器是普通用户 kali 跑的，状态文件需要它自己写。
status_file = /opt/litewaf/state/collector_status.json

# 格式：<名称> = <日志绝对路径>|<waf|access>
# waf    = nginx WAF 审计日志（14 字段 JSONL）
# access = nginx 访问日志（7 字段 JSONL）
[sources]
waf_reject   = /opt/litewaf/runtime/logs/waf_audit.log|waf
nginx_access = /opt/litewaf/runtime/logs/access.log|access
