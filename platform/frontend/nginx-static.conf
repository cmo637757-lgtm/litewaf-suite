# ==============================================================================
# LiteWAF 控制台静态站点（生产模式）
#
# 为什么单独起一个实例：
#   · 18010 是「被保护站点」，它的 nginx 是装了 LiteWAF 模块的那份二进制；
#     控制台页面不需要走 WAF，混在一起会让「引擎挂了页面还能不能看」这条演示失效。
#   · Vite dev server（5173）适合开发，但它依赖 node_modules，答辩时不可靠。
#
# 用法：
#   sudo /usr/sbin/nginx -c /opt/litewaf/platform/frontend/nginx-static.conf
#   重载：sudo /usr/sbin/nginx -c ... -s reload
#   停止：sudo /usr/sbin/nginx -c ... -s quit
# ==============================================================================
worker_processes 2;
error_log  /opt/litewaf/runtime/logs/static_error.log warn;
pid        /opt/litewaf/runtime/logs/static_nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /opt/litewaf/runtime/logs/static_access.log;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # 默认临时目录是编译期的 /var/lib/nginx/*，Kali 上属主不对、worker 写不进去，
    # 启动会直接 [emerg] mkdir() failed。显式指到 runtime 下并提前 chown www-data。
    client_body_temp_path /opt/litewaf/runtime/tmp/body;
    proxy_temp_path       /opt/litewaf/runtime/tmp/proxy;
    fastcgi_temp_path     /opt/litewaf/runtime/tmp/fastcgi;
    uwsgi_temp_path       /opt/litewaf/runtime/tmp/uwsgi;
    scgi_temp_path        /opt/litewaf/runtime/tmp/scgi;

    # 前端打包后单个 chunk 有 1MB 多（ECharts），不压缩现场加载会明显卡
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml;

    server {
        listen      18082;
        server_name _;

        root  /opt/litewaf/platform/frontend/dist;
        index index.html;

        # 接口全部反代给平台后端，前端用相对路径 /api 就能跑，不用配 CORS
        location /api/ {
            proxy_pass         http://127.0.0.1:18080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # 首页 do not cache，保证改了 dist 刷新就生效；assets 带 hash 可以长缓存
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # SPA：/events/12 这种前端路由直接刷新也要能落到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
